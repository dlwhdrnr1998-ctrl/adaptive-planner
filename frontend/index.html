<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="오늘 할 일을 명확하게 보여주는 개인 운영 시스템" />
    <title>Personal OS</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23365f4a%22/><path d=%22M9 16h14M16 9v14%22 stroke=%22white%22 stroke-width=%222.5%22/></svg>" />
    <link rel="stylesheet" href="/assets/css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#today">Personal OS</a>
        <nav aria-label="주요 메뉴">
          <a href="#today" data-nav="today">Today</a>
          <a href="#routines" data-nav="routines">Routines</a>
          <a href="#projects" data-nav="projects">Projects</a>
          <a href="#inbox" data-nav="inbox">Inbox</a>
        </nav>
      </header>
      <main id="app" tabindex="-1"><p class="muted">불러오는 중…</p></main>
    </div>
    <dialog id="progress-dialog">
      <form id="progress-form" method="dialog">
        <input type="hidden" name="task_id" />
        <div class="dialog-heading"><div><p class="eyebrow">PROGRESS</p><h2 id="progress-title">수행 기록</h2></div><button class="icon-button" value="cancel" aria-label="닫기">×</button></div>
        <label>실제 수행시간<input name="actual_minutes" type="number" min="0" required /><span>분</span></label>
        <label>실제 수행량<input name="actual_value" type="number" min="0" step="0.1" /></label>
        <label>결과<select name="result"><option value="completed">완료</option><option value="partial">일부 수행</option><option value="failed">실패</option></select></label>
        <label>메모<textarea name="memo" rows="3" placeholder="선택 입력"></textarea></label>
        <div class="form-actions"><button value="cancel" class="button secondary">취소</button><button type="submit" value="default" class="button primary">기록 저장</button></div>
      </form>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/assets/js/app.js"></script>
  </body>
</html>
